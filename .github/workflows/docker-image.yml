name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Build image (tag = PHP major.minor only)
      run: |
        docker build . \
          --tag mikehajj/faster-php:8.4
    - name: Login to Docker
      if: github.event_name == 'push'
      run: docker login --username mikehajj --password $docker_pwd
      env:
        docker_pwd: ${{ secrets.DOCKER_PWD }}
    - name: Push PHP version tag only (never :latest / :noble / :24.04)
      if: github.event_name == 'push'
      run: |
        docker push mikehajj/faster-php:8.4
